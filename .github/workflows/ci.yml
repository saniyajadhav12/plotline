name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: plotline
          POSTGRES_PASSWORD: plotline_dev_password
          POSTGRES_DB: plotline_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U plotline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check backend/

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://plotline:plotline_dev_password@localhost:5433/plotline_test
          JWT_SECRET_KEY: test-secret-key
          GEMINI_API_KEY: test-key
          TMDB_API_KEY: test-key
        run: python -m pytest -v

      - name: Build Docker image
        working-directory: backend
        run: docker build -t plotline-backend:ci .

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build
        working-directory: web
        env:
          BACKEND_API_URL: http://localhost:8000
        run: npm run build
